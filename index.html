<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant - Live Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
  header{background:#0a0a0a;border-bottom:2px solid #00ff66;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:18px;color:#00ff66;letter-spacing:1px}
  .status{font-size:12px;color:#00ff66;border:1px solid #00ff66;padding:4px 10px;border-radius:20px}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#000}
  .msg{max-width:85%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.5}
  .ai{background:#0f1f14;border:1px solid #00ff66;color:#fff;align-self:flex-start}
  .user{background:#00ff66;color:#000;align-self:flex-end;font-weight:bold}
  .emotion{font-size:11px;color:#00ff66;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
  #cameraBox{display:none;background:#111;border-top:2px solid #00ff66;padding:10px;text-align:center}
  video{width:100%;max-height:240px;background:#000;border:1px solid #00ff66}
  .controls{background:#0a0a0a;border-top:2px solid #00ff66;padding:10px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:#000;color:#00ff66;border:1px solid #00ff66;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:bold;flex:1}
  #inputArea{display:flex;gap:8px;padding:10px;background:#0a0a0a}
  input{flex:1;background:#111;color:#fff;border:1px solid #00ff66;padding:12px;border-radius:8px;outline:none}
</style>
</head>
<body>
<header><h1>AI ASSISTANT</h1><div class="status" id="statusText">LIVE CHAT OPEN</div></header>
<div id="chat"></div>
<div id="cameraBox"><video id="video" autoplay playsinline></video><p style="font-size:12px;color:#00ff66;margin-top:6px">CAMERA PREVIEW - PERMISSION REQUIRED</p></div>
<div class="controls">
  <button onclick="startVoice()">VOICE ON</button>
  <button onclick="toggleCamera()">CAMERA</button>
  <button onclick="switchCamera()">FRONT / BACK</button>
  <button onclick="openWhatsApp()">WHATSAPP</button>
</div>
<div id="inputArea"><input id="userInput" placeholder="এখানে লিখুন..." onkeypress="if(event.key==='Enter') sendMsg()"><button onclick="sendMsg()">SEND</button></div>
<script>
let currentFacing = "user";
let stream = null;
let chatBox = document.getElementById('chat');
function addMsg(text, who, emotion){
  let div = document.createElement('div');
  div.className = 'msg ' + who;
  if(emotion) div.innerHTML = '<div class="emotion">Emotion: '+emotion+'</div>' + text;
  else div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}
function speak(text){
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'bn-BD'; u.rate = 1; u.pitch = 1.2;
  let voices = window.speechSynthesis.getVoices();
  let female = voices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.lang.includes('bn'));
  if(female) u.voice = female;
  window.speechSynthesis.speak(u);
}
function getReply(input){
  input = input.toLowerCase();
  if(input.includes('whatsapp') || input.includes('হোয়াটসঅ্যাপ')) return {text: "ঠিক আছে। আমি WhatsApp খোলার লিংক দিচ্ছি।", emotion: "STRICT"};
  if(input.includes('কেমন') || input.includes('hello') || input.includes('hi')) return {text: "আমি ঠিক আছি। তুমি কি কাজ করাতে চাও সেটা পরিষ্কার করে বলো।", emotion: "STRICT"};
  if(input.includes('ক্যামেরা')) return {text: "ক্যামেরা চালু করতে CAMERA বাটনে চাপ দাও।", emotion: "SERIOUS"};
  return {text: "তোমার কথা শুনেছি। তুমি বলো, আমি কি করবো?", emotion: "FOCUSED"};
}
function sendMsg(){
  let inp = document.getElementById('userInput');
  let val = inp.value.trim();
  if(!val) return;
  addMsg(val, 'user'); inp.value = '';
  let r = getReply(val);
  setTimeout(()=>{ addMsg(r.text, 'ai', r.emotion); speak(r.text); }, 400);
}
async function toggleCamera(){
  let box = document.getElementById('cameraBox');
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; box.style.display = 'none'; return; }
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode: currentFacing}, audio:false}); document.getElementById('video').srcObject = stream; box.style.display = 'block'; }catch(e){ alert('Camera permission দাও'); }
}
async function switchCamera(){ currentFacing = currentFacing === 'user' ? 'environment' : 'user'; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } toggleCamera(); }
function openWhatsApp(){ window.open('https://wa.me/', '_blank'); addMsg("WhatsApp খোলার জন্য লিংক খুলে দিয়েছি।", 'ai', 'STRICT'); }
function startVoice(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Chrome ব্যবহার করো'); return; }
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = new SR(); rec.lang = 'bn-BD'; rec.start();
  document.getElementById('statusText').textContent = 'LISTENING...';
  rec.onresult = function(e){ let text = e.results[0][0].transcript; addMsg(text, 'user'); let r = getReply(text); addMsg(r.text, 'ai', r.emotion); speak(r.text); document.getElementById('statusText').textContent = 'LIVE CHAT OPEN'; }
}
window.onload = function(){ addMsg("আমি Live Chat এ চলে এসেছি। আমি কঠোর ভাবে কথা বলবো। তুমি কি চাও সেটা বলো।", 'ai', 'STRICT'); speak("আমি লাইভ চ্যাটে চলে এসেছি। তুমি কি চাও সেটা বলো।"); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
  </html>
